<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
.st-card{ font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", serif; background:#f3e9d2; color:#3a2e22; border:1px solid #b89b6a; border-radius:12px; padding:16px; margin-bottom:16px; position:relative; max-width:920px; margin:0 auto 16px; box-shadow: inset 0 0 0 1px rgba(158,59,46,.10); }
.st-front,.st-back{ }
.st-stratagem.flipped .st-front{ display:none; }
.st-stratagem:not(.flipped) .st-back{ display:none; }
.st-order{ font-size:13px; color:#8a6a3a; letter-spacing:1px; }
.st-pill{ position:absolute; top:16px; right:16px; background:#9e3b2e; color:#f7efe0; font-size:12px; padding:3px 10px; border-radius:12px; }
.st-name{ font-size:36px; font-weight:bold; color:#3a2e22; margin:8px 44px 4px 0; letter-spacing:3px; }
.st-pinyin{ font-size:15px; color:#7a6a52; font-style:italic; }
.st-source{ margin-top:12px; padding:10px 12px; background:rgba(158,59,46,.07); border-radius:8px; font-size:15px; line-height:1.7; border-left:3px solid #9e3b2e; }
.st-hint{ margin-top:12px; font-size:11px; color:#a08a66; text-align:right; }
.st-sec{ margin-top:12px; }
.st-sec-h{ font-size:15px; color:#9e3b2e; border-left:3px solid #9e3b2e; padding-left:7px; margin-bottom:4px; letter-spacing:1px; }
.st-sec-b{ font-size:18px; line-height:1.75; }
.st-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:14px; }
.st-act{ display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:18px; border:1px solid #b89b6a; background:#fbf3e0; color:#9e3b2e; cursor:pointer; font-size:15px; line-height:1.4; }
.st-act:hover{ background:#f0e2c4; }
.st-act i{ font-size:15px; }
.st-act.on{ background:#9e3b2e; color:#fff; border-color:#9e3b2e; }
.st-seal{ position:absolute; top:16px; right:16px; width:42px; height:42px; border:2px solid #9e3b2e; border-radius:8px; color:#9e3b2e; font-size:12px; display:flex; align-items:center; justify-content:center; transform:rotate(-7deg); font-weight:bold; }
.st-ov-title{ font-size:32px; font-weight:bold; margin:6px 50px 4px 0; letter-spacing:2px; }
.st-ov-theme{ font-size:15px; color:#9e3b2e; margin-bottom:10px; letter-spacing:1px; }
.st-ov-body{ font-size:16px; line-height:1.8; }
 body{background:#efe6d2;padding:24px;font-family:Georgia,'Songti SC','STSong',serif;}.stage{display:flex;flex-wrap:wrap;gap:18px;}.note{margin:0 0 18px;color:#7a6a52;font-size:14px;}
.st-egg{ margin-top:12px; position:relative; }
.st-egg-stamp{ position:absolute; top:-4px; right:0; width:64px; height:64px; border:2px solid #9e3b2e; border-radius:8px; color:#9e3b2e; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-12deg); font-weight:bold; font-size:22px; opacity:.85; box-shadow:0 0 0 2px rgba(158,59,46,.15); }
.st-egg-stamp-sub{ font-size:9px; font-weight:normal; letter-spacing:1px; margin-top:3px; }
.st-egg-note{ margin-top:14px; font-size:14px; color:#9e3b2e; line-height:1.7; border-top:1px dashed #b89b6a; padding-top:8px; }
@keyframes st-run-away{ 0%{transform:translateX(0) rotate(0);opacity:1} 25%{transform:translateX(34px) rotate(6deg);opacity:.5} 50%{transform:translateX(34px) rotate(6deg);opacity:.5} 65%{transform:translateX(-26px) rotate(-5deg);opacity:.6} 100%{transform:translateX(0) rotate(0);opacity:1} }
.st-run{ animation:st-run-away .7s ease; }
@keyframes st-whoosh{ 0%{opacity:0;transform:translateX(0)} 30%{opacity:.9;transform:translateX(40px)} 100%{opacity:0;transform:translateX(95px)} }
.st-run::after{ content:'whoosh——'; position:absolute; top:38%; left:58%; color:#9e3b2e; font-size:15px; opacity:.8; pointer-events:none; animation:st-whoosh .7s ease; }
</style>
</head><body>
<div class="note">Click the buttons at bottom-right to flip / read / mark / favorite (preview uses dummy data; audio is silent).</div>
<div id="stage" class="stage"></div>
<script>
window.cardTemplate = {
  name: '36 Stratagems · Classical',
  lang: 'en',
  fields: [
    {key:'order',label:'No.',hideable:false},
    {key:'set',label:'Set',hideable:false},
    {key:'set_order',label:'In-set #'},
    {key:'name',label:'Name',hideable:false},
    {key:'pinyin',label:'Pinyin'},
    {key:'source',label:'Source'},
    {key:'explanation',label:'Meaning'},
    {key:'story',label:'Story'},
    {key:'reflection',label:'Reflection'},
    {key:'type',label:'Type',hideable:false},
    {key:'title',label:'Overview title'},
    {key:'theme',label:'Theme'},
    {key:'body',label:'Overview body'}
  ],
  render: function(cardHtml, cardData, api){
    function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    var d = cardData.data;
    var id = cardData.id;
    var hidden = api.getHiddenFields ? api.getHiddenFields() : null;
    function isHidden(k){ return hidden && hidden.has && hidden.has(k); }
    function show(k, html){ return isHidden(k) ? '' : html; }
    var root = '';
    if(d.type === 'overview'){
      root = ''
      + '<div class="st-card st-overview" data-card-id="'+id+'">'
      + '<div class="st-seal">'+esc(d.set)+'</div>'
      + '<div class="st-ov-title">'+esc(d.title)+'</div>'
      + '<div class="st-ov-theme">'+esc(d.theme)+'</div>'
      + show('body','<div class="st-ov-body">'+esc(d.body)+'</div>')
      + '<div class="st-actions">'
      +   '<button class="st-act" data-action="audio" title="Read"><i class="fas fa-volume-up"></i><span>Read</span></button>'
      +   '<button class="st-act" data-action="mark" title="Mark"><i class="fas fa-bookmark"></i><span>Mark</span></button>'
      +   '<button class="st-act" data-action="favorite" title="Favorite"><i class="fas fa-star"></i><span>Favorite</span></button>'
      + '</div>'
      + '</div>';
    } else {
      var back = ''
        + show('explanation','<div class="st-sec"><div class="st-sec-h">Meaning</div><div class="st-sec-b">'+esc(d.explanation)+'</div></div>')
        + show('story','<div class="st-sec"><div class="st-sec-h">Story</div><div class="st-sec-b">'+esc(d.story)+'</div></div>')
        + show('reflection','<div class="st-sec"><div class="st-sec-h">Reflection</div><div class="st-sec-b">'+esc(d.reflection)+'</div></div>');
      var isLast = (d.order === 36);
      var egg = isLast ? ('<div class="st-egg">' + '<div class="st-egg-stamp">CLEAR<div class="st-egg-stamp-sub">No.36</div></div>' + '<div class="st-egg-note">— The best strategy is to retreat. You\'ve reached the 36th and final stratagem. Congratulations, you\'ve completed all 36!</div>' + '</div>') : '';

      root = ''
      + '<div class="st-card st-stratagem" data-card-id="'+id+'">'
      +   '<div class="st-front">'
      +     '<div class="st-order">Stratagem '+d.order+'</div>'
      +     '<div class="st-pill">'+esc(d.set)+'</div>'
      +     '<div class="st-name">'+esc(d.name)+'</div>'
      +     show('pinyin','<div class="st-pinyin">'+esc(d.pinyin)+'</div>')
      +     show('source','<div class="st-source">'+esc(d.source)+'</div>')
      +     '<div class="st-hint">Click to flip for meaning ›</div>'
      +   '</div>'
      +   '<div class="st-back">'
      +     back
      +     '<div class="st-hint">‹ Click to flip back</div>'
      +     egg
      +   '</div>'
      +   '<div class="st-actions">'
      +     '<button class="st-act" data-action="audio" title="Read"><i class="fas fa-volume-up"></i><span>Read</span></button>'
      +     '<button class="st-act" data-action="flip" title="Flip"><i class="fas fa-sync-alt"></i><span>Flip</span></button>'
      +     '<button class="st-act" data-action="mark" title="Mark"><i class="fas fa-bookmark"></i><span>Mark</span></button>'
      +     '<button class="st-act" data-action="favorite" title="Favorite"><i class="fas fa-star"></i><span>Favorite</span></button>'
      +   '</div>'
      + '</div>';
    }
    return root;
  },
  init: function(el, cardData, api){
    var d = cardData.data;
    el.querySelectorAll('.st-act').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var a = btn.getAttribute('data-action');
        if(a==='flip'){
          el.classList.toggle('flipped');
          if(api.track) api.track('flip');
          if(d.order === 36){
            el.classList.remove('st-run');
            void el.offsetWidth;
            el.classList.add('st-run');
            if(api.track) api.track('easter_egg');
          }
        } else if(a==='audio'){
          var txt = d.type==='overview' ? (d.title||'') : (d.name||'');
          api.playAudio(txt);
          if(api.track) api.track('audio_play');
        } else if(a==='mark'){
          if(api.toggleMark) api.toggleMark();
          btn.classList.toggle('on');
          if(api.track) api.track('word_mark');
        } else if(a==='favorite'){
          if(api.toggleFavorite) api.toggleFavorite();
          btn.classList.toggle('on');
          if(api.track) api.track('favorite_toggle');
        }
      });
    });
  }
};
</script>
<script>
var apiMock = {
  getHiddenFields: function(){ return { has: function(){ return false; } }; },
  playAudio: function(t){ console.log('audio:', t); },
  toggleMark: function(){}, toggleFavorite: function(){}, track: function(){}
};
var samples = [{"id": 1, "data": {"type": "stratagem", "order": 1, "set": "Winning Stratagems", "set_order": 1, "name": "Cross the Sea Under Camouflage", "pinyin": "mán tiān guò hǎi", "source": "When precautions are complete, vigilance slackens; the familiar is trusted. The hidden lies within the obvious, not apart from it.", "explanation": "Show the ordinary to hide the extraordinary, so the enemy drops its guard through sheer familiarity.", "story": "Xue Rengui built a \"mansion\" for the sea-fearing Emperor Taizong and feasted him while a great ship carried them across — a surprise landing hidden in plain sight.", "reflection": "The enduring truth: what is shown openly is rarely questioned. Mastery is making the decisive move look like routine."}}, {"id": 2, "data": {"type": "stratagem", "order": 2, "set": "Winning Stratagems", "set_order": 2, "name": "Besiege Wei to Rescue Zhao", "pinyin": "wéi wèi jiù zhào", "source": "To attack a massed enemy, divide it; strike where it is weak rather than meet its strength head-on.", "explanation": "Instead of relieving Zhao directly, strike Wei’s capital so the enemy must turn back — then ambush it worn and divided.", "story": "At Guiling, Sun Bin besieged Wei’s capital, broke the siege of Zhao, and captured Pang Juan on the march.", "reflection": "Pressure the point your opponent cannot abandon; they will retreat from where you are weak to defend where they are weak."}}, {"id": 3, "data": {"type": "stratagem", "order": 31, "set": "Defeat Stratagems", "set_order": 1, "name": "The Beauty Trap", "pinyin": "měi rén jì", "source": "Against a strong army, strike its general; against a wise general, strike his heart.", "explanation": "Send beauty close to the key figure to cloud his judgment and lower his guard.", "story": "Goujian sent Xi Shi to King Fuchai, muddling his rule until Yue destroyed Wu.", "reflection": "Desire is the oldest gate; through it even the strongest falls."}}, {"id": 4, "data": {"type": "stratagem", "order": 36, "set": "Defeat Stratagems", "set_order": 6, "name": "Retreat is the Best Option", "pinyin": "zǒu wéi shàng", "source": "Withdraw the whole army from the foe. To step back in order is no fault, for it preserves the norm.", "explanation": "When the odds are lost, retire intact — keep the mountain green for another day.", "story": "Duke Wen of Jin \"retreated three days’ march\" to avoid Chu’s edge, then won at Chengpu and became hegemon.", "reflection": "To retreat in order is not defeat; it is the field kept for the next victory."}}, {"id": 5, "data": {"type": "overview", "order": 0, "set": "Winning Stratagems", "set_order": 0, "title": "Winning Stratagems", "theme": "The Art of Offense from Strength", "body": "These are used when you hold the initiative. The theme is turning strength into a decisive blow through disguise and timing, not brute force."}}];
var stage = document.getElementById('stage');
samples.forEach(function(s){
  var html = window.cardTemplate.render('', {id:s.id, data:s.data}, apiMock);
  var wrap = document.createElement('div');
  wrap.innerHTML = html;
  var el = wrap.firstElementChild;
  window.cardTemplate.init(el, {id:s.id, data:s.data}, apiMock);
  stage.appendChild(el);
});
</script>
</body></html>
