<div class="pk-card pk-bl" data-card-id="{{id}}">
    <!-- 说明：卡片 DOM 由 cardJs 的 render() 生成（应用传入的 cardHtml 恒为空串）。
      ┌ 顶部    序号 + 单元 + 提示等级 chip
      ├ 题面    中文（只给中文 —— 这才是"无提示产出"，图标不代言单词）
      ├ 答案区  四线三格空槽，按字母占格摆放
      ├ 砖池    打乱的字母砖；点砖读字母名，点槽退回
      ├ 底部    小猫（答错安抚）/ 大狗（答对欢呼）+ 气泡
      ├ 按钮    听 / 提示 / 不熟 / 收藏（答对后换成"下一题 →"）
      └ 图鉴    6 只角色
    -->
    <div class="pk-head">
        <span class="pk-badge">{{current_order}}</span>
        <span class="pk-chip">{{unit}}</span>
    </div>
    <div class="pk-prompt">
        <span class="pk-zh">{{zh}}</span>
    </div>
    <div class="pk-answer"></div>
    <div class="pk-pool"></div>
    <div class="pk-foot"></div>
    <div class="pk-acts"></div>
    <div data-veil-host></div>
</div>
